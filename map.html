<div id="menu-dropdown">

  </div>
  <div class="menu-item" onclick="window.location='index.html#ready-section';closeMenu()">
    <div class="menu-icon">✅</div>
    <div><div class="menu-item-title">Get Ready with Me</div><div class="menu-item-sub">Step-by-step checklist</div></div>
  </div>
  <div class="menu-item" onclick="window.location='index.html#cities-section';closeMenu()">

  <div class="menu-item" onclick="window.location='map.html';closeMenu()">

    <div><div class="menu-item-title">Explore the Map</div><div class="menu-item-sub">Plan your route</div></div>
  </div>
  <div class="menu-item" onclick="window.location='index.html#community-section';closeMenu()">
    <div class="menu-icon">👥</div>
    <div><div class="menu-item-title">Community</div><div class="menu-item-sub">Tips and News</div></div>
  </div>
  <div class="menu-item menu-item-featured" onclick="window.location='play/';closeMenu()">
    <div class="menu-icon">🎮</div>
    <div><div class="menu-item-title">China Challenge</div><div class="menu-item-sub">You think you know China?</div></div>
    <span class="mbadge mbadge-gold">BETA</span>
  </div>
  <div class="menu-item" onclick="openModal('planning-modal');closeMenu()">
    <div class="menu-icon">🤖</div>
    <div><div class="menu-item-title">AI Trip Planner</div><div class="menu-item-sub">Auto itinerary</div></div>
    <span class="mbadge mbadge-gray">SOON</span>
  </div>
  <div class="menu-item" onclick="openModal('about-modal');closeMenu()">
    <div class="menu-icon">🙋‍♀️</div>
    <div><div class="menu-item-title">Meet Katherine</div><div class="menu-item-sub">Who built this &amp; why</div></div>
  </div>
</div>

<!-- MAP TOOLTIP -->
<div id="prov-tip">
  <div class="tzh" id="tip-zh"></div>
  <div class="ten" id="tip-en"></div>
  <div class="tdesc" id="tip-desc"></div>
</div>

<main>

<!-- ═══════════ FULL MAP ═══════════ -->
<div id="map-container" data-mode="full" data-map-url="assets/china-Map.svg" data-cities-url="./data/cities.json"></div>

</main>

<footer id="site-footer"></footer>

<!-- MODALS -->
<div id="ready-modals-container"></div>
<div id="about-container"></div>
<div id="planner-container"></div>

<!-- PHOTO LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo gallery">
  <button id="lb-close" onclick="closeLightbox()" aria-label="Close gallery">&#x2715;</button>
  <button id="lb-prev"  onclick="navigateLightbox(-1)" aria-label="Previous photo">&#8592;</button>
  <div id="lb-inner">
    <img id="lb-img" src="" alt="">
    <div id="lb-caption"></div>
    <div id="lb-counter"></div>
  </div>
  <button id="lb-next"  onclick="navigateLightbox(1)" aria-label="Next photo">&#8594;</button>
</div>


<!-- SCRIPTS — ui.js must be first (provides global functions) -->
