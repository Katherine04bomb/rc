name: Build site artifacts

on:
  push:
    branches: [main]

# 允许 workflow 把生成的文件 push 回仓库（默认只读，不写这段 git push 会 403）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止 CI 自己提交的变更再次触发 CI，避免无限循环
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第一步必须先跑这个：把 community.js 里的新帖子生成成真实 HTML 页面。
      # build_all.py 不负责这件事（它只扫描已存在的 HTML），所以漏了这步，
      # 新帖子就只有卡片、没有独立页面，Google 永远搜不到。
      - name: Generate community post pages
        run: python _builder/community_generator.py

      # 第二步再跑 build_all.py：重建 sitemap + 搜索索引（此时新帖页面已存在，会被扫进去）
      - name: Run build_all.py
        run: python _builder/build_all.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 注意：搜索索引输出在 data/ 下，不在根目录
          git add sitemap.xml guides.html
          git add data/search-index.json
          git add community/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: rebuild sitemap & search index [skip ci]"
          git push
